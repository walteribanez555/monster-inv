<div class=" flex flex-col w-full">
  <div  class="px-8 gap-2 md:py-4 pt-4 ">
    <app-list-warehouses  [warehouses]="warehouses()"   (onfilterEvent)="onFilterByWarehouse($event)" ></app-list-warehouses>

  </div>
  <div *ngIf="warehouseSelected"  class='mx-auto  py-8  flex flex-col md:flex-row items-start  px-8 gap-2  md:w-full overflow-auto  h-full scrollbar-thumb-rounded scrollbar-track-rounded grow  scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted md:py-4 '>
    <app-list-products class="w-full md:w-[33%]" [products]="productsList()" (onSelectItemEvent)="onSelectItem($event)"    ></app-list-products>
    <app-form-recipes  [listProducts]="listProducts" class="w-full md:w-[66%]"  (onReceivedInterfaceList)="onCreatedInterface($event)"  (onSubmitEvent)="onCreateRecipe($event)" ></app-form-recipes>
  </div>

  <ng-content *ngIf="!warehouseSelected"  class='py-8  flex flex-col md:flex-row items-start  px-8 gap-2  md:w-full overflow-auto  h-full scrollbar-thumb-rounded scrollbar-track-rounded grow  scrollbar-thin scrollbar-track-transparent scrollbar-thumb-muted md:py-4 ' >
    <span  class=" p-8 text text-foreground ">Se requiere seleccionar el almacen</span>
  </ng-content>


</div>
